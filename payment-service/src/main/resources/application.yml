spring:
  application:
    name: payment-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payments}
    username: ${DB_USER:saga}
    password: ${DB_PASSWORD:saga}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: ${PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health,info

payment:
  max-amount: "5000.00"
  simulated-failure-rate: ${PAYMENT_FAILURE_RATE:0.0}
