spring:
  datasource:
    url: jdbc:h2:mem:orchestrator;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;LOCK_TIMEOUT=10000
    username: sa
    password:

app:
  scheduling:
    enabled: false   # tests trigger recovery explicitly

saga:
  async: false       # run sagas inline so tests are deterministic
  retry:
    max-attempts: 2
    initial-backoff: PT0.001S
    max-backoff: PT0.002S
  durable:
    max-attempts: 3
    initial-backoff: PT10S
    max-backoff: PT1M
